plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.center"
    compileSdkVersion 34          // Explicitly specify compile SDK version

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.example.center"
        minSdkVersion 21             // Explicitly set min SDK
        targetSdkVersion 34          // Explicitly set target SDK
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
    release {
        minifyEnabled true         // Enables code shrinking
        shrinkResources true       // Enables unused resources shrinking
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    debug {
        minifyEnabled false        // Disables shrinking for debug mode
        shrinkResources false      // Disables resource shrinking for debug mode
    }
}

}

flutter {
    source = "../.."
}
